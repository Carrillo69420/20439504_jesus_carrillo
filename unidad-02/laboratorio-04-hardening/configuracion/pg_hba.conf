# =====================================================
# LAB-04 — Hardening y configuración segura de PostgreSQL
# pg_hba.conf después del hardening (dba-practica)
# Alumno: Jesús Arturo Carrillo Avilez
# =====================================================
#
# PostgreSQL rechaza toda conexión que no coincida con alguna de estas
# líneas, así que lo que no aparece aquí queda negado.
#
# TYPE   DATABASE          USER                  ADDRESS        METHOD

# Administración: solo por el socket local y solo como el usuario postgres
# del sistema operativo (docker exec -u postgres)
local    all               postgres                             peer

# Aplicación: solo su base, solo desde el propio servidor y solo con TLS
hostssl  comercializadora  app_comercializadora  127.0.0.1/32   scram-sha-256
hostssl  comercializadora  app_comercializadora  ::1/128        scram-sha-256
